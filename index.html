<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05061a">
  <meta name="description" content="Learnex AI — educational assistant for Mathematics, Science, Physics, Chemistry, Geography and History.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preload" as="image" href="/splash.png">
  <link rel="preload" as="image" href="/icon-512.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Learnex AI</title>
</head>
<body>
  <div id="splash" class="splash" aria-label="Learnex AI loading">
    <img id="splashImage" src="/splash.png" alt="Learnex AI loading">
    <div class="splash-fallback">Learnex AI</div>
  </div>

  <div id="app" class="app is-hidden">
    <header class="topbar">
      <button class="icon-button" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="brand">
        <img src="/icon-192.png" alt="Learnex AI logo" class="brand-logo">
        <div><div class="brand-name">Learnex <span>AI</span></div><div class="status"><i></i> Educational assistant</div></div>
      </div>
      <button class="clear-btn" id="clearBtn">✦ <span>Clear</span></button>
    </header>

    <main class="main">
      <section id="welcome" class="welcome">
        <div class="hero-orbit"><div class="orbit-ring"></div><img src="/icon-512.png" alt="Learnex AI" class="hero-logo"></div>
        <h1>What would you<br><span>like to learn?</span></h1>
        <p>Ask a question in English or বাংলা.<br>Learnex will respond in the language you use.</p>
        <div class="suggestions">
          <button data-prompt="Explain fractions like I'm 12">√x&nbsp; Explain fractions like I'm 12 <b>+</b></button>
          <button data-prompt="Explain photosynthesis">◈&nbsp; Explain photosynthesis <b>+</b></button>
          <button data-prompt="বাংলায় প্রশ্ন করো">অআ&nbsp; Ask in বাংলা <b>+</b></button>
          <button data-prompt="Explain neural networks">♧&nbsp; Explain neural networks <b>+</b></button>
        </div>
      </section>

      <section id="chat" class="chat" aria-live="polite"></section>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer">
        <button type="button" class="plus" id="plusBtn" aria-label="Add">+</button>
        <textarea id="input" rows="1" placeholder="Ask a question in English or বাংলা..." autocomplete="off"></textarea>
        <button type="button" class="mic" id="micBtn" aria-label="Voice input">⌕</button>
        <button type="submit" class="send" aria-label="Send">➤</button>
      </form>
      <div class="hint">Enter to send · Shift + Enter for a new line</div>
    </footer>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>Learnex AI</strong><button id="closeDrawer">×</button></div>
    <button id="newChat">＋ New chat</button>
    <div class="drawer-label">Recent chats</div>
    <div id="history" class="history"></div>
    <div class="drawer-foot">Educational assistant<br><small>English + বাংলা</small></div>
  </aside>
  <div id="backdrop" class="backdrop"></div>
  <script src="/app.js" defer></script>
</body>
</html>
